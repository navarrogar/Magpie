<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 320px; background: #131419; color: #e9e7e2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 14px;
  }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .mark { width: 10px; height: 10px; flex: none;
    background: linear-gradient(135deg, #e8b14e 50%, #4d5260 50%);
    transform: rotate(45deg) translateY(1px); }
  h1 { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .field { display: flex; background: #1b1d24; border: 1px solid #2a2d36;
    border-radius: 8px; overflow: hidden; }
  .field:focus-within { border-color: #7a5e2a; }
  input { flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: #e9e7e2; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; padding: 10px; }
  input::placeholder { color: #565a64; }
  button { background: #e8b14e; color: #1d1605; border: none; font-weight: 700;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding: 0 14px; cursor: pointer; }
  label { display: flex; align-items: center; gap: 6px; margin-top: 10px;
    font-size: 11.5px; color: #8b8e98; cursor: pointer; }
  #status { margin-top: 10px; font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; color: #8b8e98; min-height: 15px; word-break: break-word; }
  #status.ok { color: #8fc98f; } #status.err { color: #d98080; }
  .hint { margin-top: 10px; font-size: 10.5px; color: #50535d; line-height: 1.5; }
</style>
</head>
<body>
  <header><div class="mark"></div><h1>Magpie</h1></header>
  <div class="field">
    <input id="url" type="text" placeholder="paste a tweet link…" spellcheck="false">
    <button id="go">Save</button>
  </div>
  <label><input type="checkbox" id="photos"> include photos</label>
  <div id="status"></div>
  <p class="hint">Files land in Downloads/Magpie/. On x.com, tweets with video also get a ⬇ button in their action bar.</p>
  <script src="popup.js"></script>
</body>
</html>
